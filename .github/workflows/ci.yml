name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  check:
    name: 语法与结构检查 (Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest ]
        node: [ '18', '20', '22' ]

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: 检查 CLI 脚本语法
        run: node --check src/shotguard-verify.js

      - name: 检查 package.json 合法性
        run: node -e "const p=require('./package.json'); if(!p.name||!p.version) process.exit(1); console.log('package.json OK:', p.name, p.version)"

      - name: 检查必需文件存在
        shell: bash
        run: |
          for f in README.md LICENSE .gitignore .env.example index.html src/shotguard-verify.js docs/USAGE.md; do
            if [ ! -f "$f" ]; then echo "缺少文件: $f"; exit 1; fi
          done
          echo "全部必需文件存在"

      - name: 检查案例报告完整
        shell: bash
        run: |
          for f in cases/case-a-naive-prompt.html cases/case-b-long-unstructured.html cases/case-c-structured-prompt.html; do
            if [ ! -f "$f" ]; then echo "缺少案例: $f"; exit 1; fi
            if ! grep -q "DOCTYPE html" "$f"; then echo "案例不是合法 HTML: $f"; exit 1; fi
          done
          echo "全部案例完整"

      - name: 检查 demo 素材完整
        shell: bash
        run: |
          for f in demo/README.md demo/reference-character.png demo/case-a-naive-prompt.mp4 demo/case-b-long-unstructured.mp4 demo/case-c-structured-prompt.mp4; do
            if [ ! -f "$f" ]; then echo "缺少 demo 素材: $f"; exit 1; fi
            if [ ! -s "$f" ]; then echo "demo 素材为空: $f"; exit 1; fi
          done
          # 校验视频文件头（MP4 的 ftyp box 位于第 5-8 字节）
          for f in demo/*.mp4; do
            if ! head -c 12 "$f" | grep -q "ftyp"; then
              echo "不是合法 MP4: $f"; exit 1
            fi
          done
          echo "demo 素材完整且格式合法"

      - name: 检查双语文档互链
        shell: bash
        run: |
          fail=0
          # README 互链
          grep -q "README.en.md" README.md      || { echo "中文 README 缺少英文版链接"; fail=1; }
          grep -q "README.md"    README.en.md   || { echo "英文 README 缺少中文版链接"; fail=1; }
          # CONTRIBUTING 互链
          grep -q "CONTRIBUTING.en.md" CONTRIBUTING.md    || { echo "中文 CONTRIBUTING 缺少英文版链接"; fail=1; }
          grep -q "CONTRIBUTING.md"    CONTRIBUTING.en.md || { echo "英文 CONTRIBUTING 缺少中文版链接"; fail=1; }
          [ $fail -eq 0 ] || exit 1
          echo "双语文档互链正常"

      - name: 检查文档内部链接有效
        shell: bash
        run: |
          fail=0
          # README 中引用的本地路径必须真实存在
          for doc in README.md README.en.md CONTRIBUTING.md CONTRIBUTING.en.md docs/ARCHITECTURE.md; do
            # 提取 markdown 链接里的相对路径（排除 http/https/# 锚点）
            grep -oE '\]\([^)#]+\.(md|js|html|png|mp4)\)' "$doc" 2>/dev/null | sed 's/](//; s/)$//' | while read -r link; do
              # 相对当前文档所在目录解析
              dir=$(dirname "$doc")
              target="$dir/$link"
              if [ ! -e "$target" ] && [ ! -e "$link" ]; then
                echo "::error file=$doc::死链 $link"
                echo "DEADLINK"
              fi
            done
          done | tee /tmp/linkcheck.txt
          if grep -q "DEADLINK" /tmp/linkcheck.txt; then
            echo "::error::文档中存在死链"
            exit 1
          fi
          echo "文档内部链接有效"

      - name: 检查 ARCHITECTURE 已挂载到 README
        shell: bash
        run: |
          grep -q "docs/ARCHITECTURE.md" README.md    || { echo "中文 README 未引用 ARCHITECTURE"; exit 1; }
          grep -q "docs/ARCHITECTURE.md" README.en.md || { echo "英文 README 未引用 ARCHITECTURE"; exit 1; }
          echo "ARCHITECTURE 已挂载到双语文档"

      - name: 扫描是否泄漏密钥
        shell: bash
        run: |
          # 排除占位符，只查真实密钥特征
          if grep -rIn --exclude-dir=.git -E 'sk-[A-Za-z0-9]{20,}' . ; then
            echo "::error::检测到疑似真实 API 密钥"
            exit 1
          fi
          echo "未发现泄漏的密钥"

      - name: 验证 CLI 可执行（无参数应打印用法）
        shell: bash
        run: |
          output=$(node src/shotguard-verify.js 2>&1 || true)
          if echo "$output" | grep -q "用法"; then
            echo "CLI 可正常启动"
          else
            echo "::error::CLI 未输出用法提示"
            echo "$output"
            exit 1
          fi
